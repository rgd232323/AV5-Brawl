[project]
name = "back-python"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.1.3,<4",
    "flask-cors>=6.0.5,<7",
    "flask-sqlalchemy>=3.1.1,<4",
    "flask-jwt-extended>=4.7.4,<5",
    "bcrypt>=5,<6",
    "gunicorn>=26,<27",
    "flask-migrate>=4.1.0",
    "psycopg2-binary>=2.9.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.vercel] 
entrypoint = "src.app:app"
